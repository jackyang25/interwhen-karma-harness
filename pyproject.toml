[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interwhen-karma-harness"
version = "0.1.0"
description = "Evaluation harness for intermediate verification of clinical AI tool calls"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jack Yang" }]

dependencies = [
    # ── External frameworks (pinned commits) ──────────────────────────────────
    # KARMA: Bearer-auth gap for MCP closed by runtime patch in harness/_patches.py.
    "karma-medeval @ git+https://github.com/eka-care/KARMA-OpenMedEvalKit.git@d3fb194acba00aa014a89d48671b402c4cff8e85",
    "interwhen @ git+https://github.com/microsoft/interwhen.git@2d041c2f3ed2a6f0a4b063463b3aef844e7dba5e",

    # ── Model APIs ────────────────────────────────────────────────────────────
    "anthropic>=0.40",

    # ── MCP client ────────────────────────────────────────────────────────────
    "fastmcp>=2.0",

    # ── Data + evaluation plumbing ────────────────────────────────────────────
    "datasets>=2.0",
    "huggingface-hub",

    # ── Analysis ──────────────────────────────────────────────────────────────
    "pandas",
    "numpy",
    "scipy",          # McNemar's test
    "statsmodels",    # Wilson confidence intervals
]

[project.optional-dependencies]
# vLLM is heavy; install only on machines that serve the model.
serving = ["vllm>=0.6.0"]
# Optional Databricks experiment tracking.
tracking = ["mlflow"]
# Dev tooling.
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.ruff]
line-length = 100
target-version = "py310"
